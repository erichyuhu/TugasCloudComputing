<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Peminjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">← Kembali ke Dashboard</a>
            <button id="btnLogout" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h4 class="card-title mb-4">Form Peminjaman Barang</h4>
                <form id="formPeminjaman">
                    <div class="mb-3">
                        <label>Nama Peminjam</label>
                        <input type="text" class="form-control" id="nama" required>
                    </div>
                    <div class="mb-3">
                        <label>Nama Barang / Alat</label>
                        <input type="text" class="form-control" id="barang" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label>Tanggal Pinjam</label>
                            <input type="date" class="form-control" id="tanggal" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Jumlah</label>
                            <input type="number" class="form-control" id="jumlah" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label>Status</label>
                            <select class="form-select" id="status">
                                <option value="Dipinjam">Dipinjam</option>
                                <option value="Dikembalikan">Dikembalikan</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Simpan Data Peminjaman</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="form.js"></script>
</body>
</html>
