<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Peminjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">Form Peminjaman</a>
        </div>
        <div class="d-flex">
            <button id="btnLogout" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container text-center">
        <h2 class="mb-4">Sistem Manajemen Peminjaman</h2>
        <div class="row justify-content-center gap-3">
            <div class="col-md-4">
                <div class="card shadow-sm py-4">
                    <h4>Peminjaman Baru</h4>
                    <p class="text-muted">Input data peminjaman alat/barang</p>
                    <a href="form.html" class="btn btn-primary">Buka Form</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm py-4">
                    <h4>Riwayat & Kelola</h4>
                    <p class="text-muted">Lihat, edit, dan hapus data peminjaman</p>
                    <a href="history.html" class="btn btn-success">Buka Riwayat</a>
                </div>
            </div>
        </div>
    </div>
</body>

<script type="module">
    // 1. Tambahkan baris import ini
    import { auth, signOut, onAuthStateChanged } from "./firebase_config.js";

    // 2. Logika proteksi halaman
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "index.html"; 
        }
    });

    // 3. Logika Logout
    const btnLogout = document.getElementById('btnLogout');
    
    if (btnLogout) {
        btnLogout.addEventListener('click', () => {
            // Konfirmasi sebelum logout
            const konfirmasi = confirm("Apakah Anda yakin ingin logout?");
            
            if (konfirmasi) {
                signOut(auth)
                    .then(() => {
                        window.location.href = "index.html"; // Arahkan kembali ke halaman login
                    })
                    .catch((error) => {
                        alert("Gagal logout: " + error.message);
                    });
            }
        });
    }
</script>
</html>
