<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Peminjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121826; color: #fff; }
        .card-custom { background-color: #1f2937; border: none; border-radius: 12px; }
        .text-center {color: #fff;}
    </style>
</head>
<body>
    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom shadow-lg p-4">
                    <h3 class="text-center mb-4" id="formTitle">Login Admin</h3>
                    <div id="pesanError" class="alert alert-danger text-center" style="display: none; padding: 10px; font-size: 14px;"></div>
                    <form id="authForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Masukkan email Anda" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="btnAuth">Masuk</button>
                    </form>
                    <div class="mt-4 text-center">
                        <a href="#" id="toggleMode" class="text-info text-decoration-none">Belum punya akun? Register di sini</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
    import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "./firebase_config.js";

    // Ambil elemen HTML berdasarkan ID
    const authForm = document.getElementById('authForm'); 
    const emailInput = document.getElementById('email'); 
    const passwordInput = document.getElementById('password'); 
    const btnAuth = document.getElementById('btnAuth'); 
    const toggleMode = document.getElementById('toggleMode'); 
    const formTitle = document.getElementById('formTitle'); 
    const pesanError = document.getElementById('pesanError'); // Elemen untuk pesan error

    // Cek jika sudah login, langsung pindah ke dashboard.html
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "dashboard.html"; 
        }
    });

    let isLogin = true; // Status default adalah halaman Login

    // Logika saat tulisan "Belum punya akun?" diklik
    toggleMode.addEventListener('click', (e) => {
        e.preventDefault();
        isLogin = !isLogin; // Balikkan status
        
        // Sembunyikan pesan error saat berganti mode
        if(pesanError) pesanError.style.display = 'none';
        
        // Ubah tampilan teks
        formTitle.innerText = isLogin ? "Login Admin" : "Register Admin";
        btnAuth.innerText = isLogin ? "Masuk" : "Daftar";
        toggleMode.innerText = isLogin ? "Belum punya akun? Register di sini" : "Sudah punya akun? Login di sini";
    });

    // Logika saat tombol Masuk/Daftar ditekan (Gunakan ID Form, bukan ID input)
    authForm.addEventListener('submit', (e) => {
        e.preventDefault(); 
        
        // Sembunyikan pesan error setiap kali tombol ditekan
        if(pesanError) pesanError.style.display = 'none';

        const email = emailInput.value;
        const password = passwordInput.value;

        if (isLogin) {
            // PROSES LOGIN
            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    // Langsung pindah halaman tanpa alert agar mulus
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    // Tampilkan pesan error di HTML
                    pesanError.innerText = "Gagal Login: Akun tidak ditemukan atau password salah!";
                    pesanError.style.display = 'block';
                    authForm.reset();   
                    console.error("Detail error:", error);
                });
        } else {
            // PROSES REGISTER
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    // Langsung pindah halaman saat berhasil mendaftar
                    window.location.href = "dashboard.html"; 
                })
                .catch((error) => {
                    // Tampilkan pesan error di HTML
                    pesanError.innerText = "Gagal Register: " + error.message;
                    pesanError.style.display = 'block';
                    authForm.reset();
                    console.error("Detail error:", error);
                });
        }
    });
</script>
</body>
</html>
